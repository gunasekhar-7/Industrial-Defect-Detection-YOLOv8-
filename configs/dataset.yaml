# Real NEU-DET dataset configuration (YOLO format).
# Build with: python -m src.data.neu_det   (downloads the official archive
# from https://faculty.neu.edu.cn/songkc/en/zdylm/263265/ and converts it;
# for CI / tests use configs/dataset_synthetic.yaml instead).
path: data/processed
train: images/train
val: images/val
test: images/test

# Six hot-rolled steel surface defect classes (NEU-DET official names)
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled_in_scale
  5: scratches
