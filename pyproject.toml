[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff defaults (E4/E7/E9/F) plus whitespace warnings and import sorting.
# E501 (line length) intentionally excluded: several legitimate long
# f-string/log lines; line-length still guides new code via formatter.
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `import src...` work for both `pytest` and `python -m pytest`
# (the console entry point does not put the CWD on sys.path).
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
# Third-party scientific packages without inline types:
ignore_missing_imports = true
# Match ruff's scope; src/data and src/ui stay out of the gate for now.
files = ["src/api", "src/models"]
