name: CI Pipeline

on:
  # Every branch push is linted and tested, not just main — a broken commit on
  # a feature branch should fail there, not first on its pull request.
  push:
    branches: ["**"]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # CI dataset is always the synthetic generator; NEU-DET is never
      # downloaded here (it is a manual, licensed fetch — see README).
      - name: Generate synthetic dataset
        run: python -m src.data.generator

      # Coverage floor is a regression gate: the suite covers src/ completely,
      # so any untested production line fails the build instead of drifting.
      - name: Run pytest with coverage
        run: pytest tests/ -v --cov-report=xml --cov-fail-under=100

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Smoke gate for the multi-stage image: build only.
      - name: Docker build
        run: docker build .
