services:
  api:
    build: .
    container_name: defect-detection-api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=models/industrial_yolov8n.onnx
      - MAX_IMAGE_SIZE_MB=15
    volumes:
      # Read-only model mount: swap weights without rebuilding the image.
      - ./models:/app/models:ro
    restart: unless-stopped

  dashboard:
    build: .
    container_name: defect-detection-dashboard
    command: streamlit run src/ui/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - MODEL_PATH=models/industrial_yolov8n.onnx
    volumes:
      # The dashboard also runs in-process inference for local inspection.
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
